[project]
name = "biomar-media-monitoring"
version = "0.1.0"
description = "Daily media monitoring for BioMar: brand, executives and competitors"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cryptography>=42",
  "openpyxl>=3.1",
  "brotli>=1.1",  # some feeds are brotli-compressed regardless of Accept-Encoding
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["monitor", "monitor.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
