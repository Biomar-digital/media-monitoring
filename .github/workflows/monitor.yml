name: Media monitor

# Collects coverage, analyses it with Claude, writes the daily briefing, commits the
# data back to the repo and publishes the dashboard. Runs every 6 hours so the dashboard
# stays current through the day. The briefing is rewritten on each run and covers the
# trailing 24 hours.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days back to search (use 180 for a backfill; 2 is the normal daily window)"
        default: "2"
  push:
    # Redeploy when code or config changes (data commits by the bot don't trigger this).
    branches: [main, claude/keen-ramanujan-mdakgb]
    paths: ["dashboard/**", "config/**", "monitor/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: media-monitor
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  monitor:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Collect
        # Pushes only rebuild the site from stored data; scheduled and manual runs collect.
        # Collection saves after every source, so even a timed-out run keeps what it found.
        if: github.event_name != 'push'
        timeout-minutes: 50
        continue-on-error: true
        run: python -m monitor collect --window-days "${{ inputs.window_days || '2' }}"

      - name: Analyse and brief
        if: always() && github.event_name != 'push'
        timeout-minutes: 15
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m monitor analyse
          python -m monitor brief

      - name: Commit data
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "biomar-media-monitor[bot]"
          git config user.email "media-monitor@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: media monitor run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build dashboard
        if: always()
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          # Without a password the dashboard is published unencrypted (readable by anyone with
          # the URL). Add the DASHBOARD_PASSWORD secret to encrypt it; nothing else changes.
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::warning::DASHBOARD_PASSWORD is not set, so the dashboard is published without a password. See README."
          fi
          python -m monitor build

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
