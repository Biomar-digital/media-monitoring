# BioMar media monitoring watchlist.
#
# Everything the collector searches for and how mentions are attributed lives here.
# Edit this file to add or remove executives or competitors. No code changes needed.
#
# Entity fields
#   id               stable key used in the data files (never rename once data exists)
#   name             display name on the dashboard
#   type             brand | executive | competitor
#   queries          search strings sent to the news sources (Google News syntax)
#   aliases          case-insensitive whole-word patterns; an article must match one
#                    of these to be attributed to the entity
#   exclude          patterns that disqualify a match (homonyms, unrelated companies)
#   require_context  for common names: the article must ALSO contain one of these word
#                    prefixes (any language), e.g. "fôr" also matches "fôrfabrikk"
#   full_text_matches  false = only count articles whose headline names the company
#                    (for large diversified companies whose names appear everywhere)
#   color_slot       fixed chart colour (1-8). Colour follows the entity, never its rank.

brand: biomar

entities:
  - id: biomar
    name: BioMar
    type: brand
    color_slot: 1
    queries:
      - '"BioMar" -"Rede Biomar" -"Projeto Biomar"'
      - '"BioMar Group"'
    aliases: ["BioMar", "Bio Mar Group", "BioMar Group", "BIOMAR"]
    exclude:
      - "BioMar Microbial"        # unrelated Spanish biotech
      - "Rede Biomar"             # Brazilian marine-conservation network
      - "Projeto Biomar"
      - "Instituto Biomar"
      - "biomarker"

  # --- Executives -----------------------------------------------------------
  # Source: BioMar Q2 2026 interim report (12 Aug 2026) and biomar.com/our-story/our-structure
  - id: carlos-diaz
    name: Carlos Diaz
    role: CEO
    type: executive
    queries: ['"Carlos Diaz" BioMar']
    aliases: ["Carlos Diaz", "Carlos Díaz"]
    require_context: ["BioMar", "aquafeed", "fish feed", "aquaculture"]

  - id: claus-eskildsen
    name: Claus Eskildsen
    role: CFO
    type: executive
    queries: ['"Claus Eskildsen"']
    aliases: ["Claus Eskildsen"]
    require_context: ["BioMar", "aquafeed", "aquaculture", "Schouw"]

  - id: jens-bjerg-sorensen
    name: Jens Bjerg Sørensen
    role: Chair of the Board
    type: executive
    queries: ['"Jens Bjerg Sørensen" BioMar', '"Jens Bjerg Sorensen" BioMar']
    aliases: ["Jens Bjerg Sørensen", "Jens Bjerg Sorensen"]
    require_context: ["BioMar", "Schouw", "aquaculture"]

  - id: paddy-campbell
    name: Paddy Campbell
    role: VP, Salmon Division
    type: executive
    queries: ['"Paddy Campbell" BioMar']
    aliases: ["Paddy Campbell"]
    require_context: ["BioMar", "salmon", "aquaculture"]

  - id: sif-rishoj
    name: Sif Rishøj
    role: VP, People, Purpose & Communication
    type: executive
    queries: ['"Sif Rishøj"']
    aliases: ["Sif Rishøj", "Sif Rishoj"]
    require_context: ["BioMar", "aquaculture"]

  # --- Competitors ----------------------------------------------------------
  - id: skretting
    name: Skretting
    type: competitor
    color_slot: 2
    # Skretting is also a Norwegian surname, so searches carry feed/aquaculture context terms.
    queries: ['"Skretting"']
    aliases: ["Skretting"]
    needs_industry_context: true   # also a Norwegian surname

  - id: cargill-aqua
    name: Cargill Aqua Nutrition
    type: competitor
    color_slot: 3
    queries: ['"Cargill" aquaculture feed', '"Cargill Aqua Nutrition"', '"EWOS"']
    aliases: ["Cargill Aqua Nutrition", "Cargill Aqua", "EWOS", "Cargill", "Nutripec"]
    require_context: [aquacult, aquafeed, "fish feed", salmon, shrimp, "fish farm", aqua, EWOS, Nutripec,
                      acuicult, aquicult, salmón, camarón, langostino, camarão, piensos acuícolas,
                      havbruk, oppdrett, laks, fiskefôr, fôr, opdræt, fiskefoder, tôm, thủy sản, 水产, 鱼饲料]
    full_text_matches: false

  - id: mowi-feed
    name: Mowi Feed
    type: competitor
    color_slot: 4
    # Mowi is mainly a salmon farmer; only its feed business is a competitor.
    queries: ['"Mowi Feed"', '"Mowi" feed salmon']
    aliases: ["Mowi Feed", "Mowi"]
    require_context: [feed, fôr, fiskefôr, pienso, alimento, foder]
    full_text_matches: false

  - id: aller-aqua
    name: Aller Aqua
    type: competitor
    color_slot: 5
    queries: ['"Aller Aqua"']
    aliases: ["Aller Aqua"]

  - id: vitapro
    name: Vitapro
    type: competitor
    color_slot: 6
    queries: ['"Vitapro"', '"Nicovita"']
    aliases: ["Vitapro", "Nicovita"]

  - id: de-heus
    name: De Heus
    type: competitor
    color_slot: 7
    queries: ['"De Heus" aqua feed', '"De Heus" aquaculture']
    aliases: ["De Heus"]
    require_context: [aqua, fish, shrimp, acuicult, camarón, peces, tôm, thủy sản, "thức ăn thủy sản", fisk, 水产]
    full_text_matches: false

  - id: haid-group
    name: Haid Group
    type: competitor
    color_slot: 8
    queries: ['"Haid Group"', '"Guangdong Haid"']
    aliases: ["Haid Group", "Guangdong Haid", "Haid", "海大"]
    require_context: [feed, aquacult, shrimp, fish, 饲料, 水产, 海大集团, tôm, "thức ăn"]
    full_text_matches: false

# Aquaculture/feed vocabulary (word prefixes, several languages). Used to accept articles
# that the search engine matched on full text but whose headline doesn't name the company,
# and to separate Skretting the company from people with that surname.
industry_context: [
  aquacult, aquafeed, "aqua feed", "aqua nutrition", feed, fish, salmon, trout, shrimp, prawn, seafood, tilapia, "sea bass", "sea bream", hatcher, krill, Nutreco,
  fôr, fisk, laks, ørret, oppdrett, havbruk, sjømat, smolt,               # Norwegian
  foder, fiske, akvakultur, opdræt, ørred,                               # Danish
  acuicult, alimento, salmón, camarón, langostino, pesca, pescado, piensos, # Spanish
  aquicult, ração, camarão, tilápia, peixe,                               # Portuguese
  aquacole, aliment, saumon, crevette, poisson,                           # French
  "su ürünleri", balık, "balık yemi", levrek, çipura,                     # Turkish
  ιχθυ, υδατοκαλλι,                                                      # Greek
  "thủy sản", "thức ăn chăn nuôi", tôm,                                  # Vietnamese
  水产, 饲料, 鱼, 虾,                                                      # Chinese
  pakan, udang, budidaya, ikan,                                           # Indonesian
]

# Publishers whose coverage is all industry news: matches from these always count.
trade_domains: [
  intrafish.com, intrafish.no, undercurrentnews.com, fishfarmingexpert.com, salmonbusiness.com, ilaks.no, kyst.no,
  feedstrategy.com, feednavigator.com, thefishsite.com, seafoodsource.com, globalseafood.org, hatcheryinternational.com,
  aquafeed.com, salmonexpert.cl, aqua.cl, mundoacuicola.cl, diarioacuicola.cl, aquahoy.com, fis.com, aquaculturenorthamerica.com,
  fishfarmermagazine.com, thefishsite.com, worldfishing.net, iqua.no, aquaculturemag.com, panoramaacuicola.com,
]

# Coverage of these organisations is ignored unless the headline also names BioMar
# (Schouw & Co is BioMar's former parent; SCHO is its ticker).
ignore_unless_brand_named: ["Schouw", "SCHO:"]

# Headlines that are never coverage (e.g. ad banners listed in publishers' feeds:
# "BioMar SmartCare Assist Skin — 980x300"). Regular expressions.
ignore_headlines:
  - '[—–-]\s*\d{2,4}\s*x\s*\d{2,4}\s*$'
  - '^(Annonse|Annonce|Sponsored|Advertisement)\b'


# Stock-data pages: automatically generated price, ratio and holdings pages (not journalism).
# They're kept and labelled "Stock data"; the dashboard can include or exclude them.
stock_data:
  # Whole sites that only publish generated data pages. (TradingView also publishes news
  # briefs, so it's matched by the ticker suffix in its data-page titles instead.)
  domains: [simplywall.st]
  title_patterns:
    - '[–:,-]\s*[A-Z]{2,10}:[A-Z0-9.]{1,10}\s*$'    # "… – MUN:2IT", "…: LS:A42CV2"
    - '\bForecast\s*[—–-]\s*Price Target\b'
    - '\b(HAN|OMXCOP|CPH|FRA|ETR|OTC|NASDAQ):\s?[A-Z0-9.]+'
    - '\bBalance Sheet\b.*[A-Z]{2,10}:'
    - '\(BIOMAR\.CO\)'
    - '\b(stock|share) price\b'
    - '\bstock quote\b'
    - '\b(call|put) \([A-Z0-9]+\)'
    - '\binsider ownership\b'
    - '\bETFs investing in\b'
    - '\b(equity in earnings|net current asset value|price to book|enterprise value|price to earnings|dividend yield) (of|de)\b'
    - '\bprecio objetivo 20\d\d, TV\b'

# Topics Claude assigns to each article (keep the list short and stable so trends are comparable).
topics:
  - Financial results & markets
  - Sustainability & ESG
  - Product & innovation
  - Raw materials & supply chain
  - Fish health & welfare
  - People & leadership
  - M&A & partnerships
  - Regulation & policy
  - Operations & facilities
  - Other

# Google News editions to search, i.e. "what the world is saying" in local languages.
# Format: [country code, edition language, optional UI language when it differs].
# English editions get en-<country> automatically. Google News has no Danish or Ecuadorian
# edition (they return nothing), so Danish coverage comes via GDELT and the other editions. Chosen to cover BioMar's main markets.
google_news_editions:
  - [US, en]
  - [GB, en]
  - [AU, en]
  - [CA, en]
  - [IN, en]
  - [NO, "no"]
  - [ES, es]
  - [CL, es-419]
  - [PE, es-419]
  - [MX, es-419]
  - [BR, pt-419, pt-BR]
  - [FR, fr]
  - [TR, tr]
  - [GR, el]
  - [VN, vi]
  - [CN, zh-Hans, zh-CN]
  - [ID, id]

# Local-language industry words added to each brand/competitor search in that language's
# editions (e.g. "Skretting" fôr). Without them, local trade press barely shows up.
local_search_terms:
  "no": [fôr, laks]
  es: [salmón, camarón]
  pt: [ração, camarão]
  fr: [aquaculture, aliment]
  tr: [balık, yem]
  el: [ιχθυοκαλλιέργεια, ιχθυοτροφές]
  vi: [tôm, "thức ăn"]
  zh: [饲料, 水产]
  id: [pakan, udang]

# Markets with no Google News edition: search each brand/competitor restricted to that
# country's web domain, via an edition that indexes it (the US edition indexes .dk/.is/.cr).
# Format: [top-level domain, edition country, edition language]
country_domain_searches:
  - [dk, US, en]
  - [is, US, en]
  - [cr, US, en]
  - [ec, US, en]

# Publisher sitemaps: a site's complete list of recent articles (robots.txt is respected).
#   type news: Google News sitemap with headlines.
#   type urls: full sitemap; article URLs are pre-filtered for watched names (the URL holds
#              the slug and, on kyst.no-style sites, editorial company tags) and only those
#              pages are fetched, at most max_fetch per run.
sitemaps:
  - {name: IntraFish, url: "https://www.intrafish.com/sitemap/news.xml", type: news, language: en}
  - {name: IntraFish Norge, url: "https://www.intrafish.no/sitemap/news.xml", type: news, country: "NO", language: "no"}
  - {name: Fiskeribladet, url: "https://www.fiskeribladet.no/sitemap/news.xml", type: news, country: "NO", language: "no"}
  - {name: misPeces, url: "https://www.mispeces.com/google-news-sitemap.xml", type: news, country: ES, language: es}
  - {name: The Fish Site, url: "https://thefishsite.com/news-sitemap.xml", type: news, language: en}
  - {name: Berlingske, url: "https://www.berlingske.dk/news-sitemap.xml", type: news, country: DK, language: da}
  - {name: Kyst.no, url: "https://www.kyst.no/sitemap.xml", type: urls, country: "NO", language: "no", max_fetch: 150}
  - {name: Fish Farming Expert, url: "https://www.fishfarmingexpert.com/sitemap.xml", type: urls, language: en, max_fetch: 150}
  - {name: Salmonexpert, url: "https://www.salmonexpert.cl/sitemap.xml", type: urls, country: CL, language: es, max_fetch: 150}

# Site sweeps: everything a trade publication published recently (via Google News), then
# filtered by the watchlist. For major trade outlets without a usable RSS feed.
# Format: [domain, edition country, edition language]
site_sweeps:
  - [ilaks.no, NO, "no"]
  - [kyst.no, NO, "no"]
  - [intrafish.no, NO, "no"]
  - [fiskeribladet.no, NO, "no"]
  - [intrafish.com, US, en]
  - [fishfarmingexpert.com, GB, en]
  - [salmonbusiness.com, GB, en]
  - [seafoodsource.com, US, en]
  - [thefishsite.com, GB, en]
  - [aquafeed.com, US, en]
  - [feedstrategy.com, US, en]
  - [undercurrentnews.com, US, en]
  - [salmonexpert.cl, CL, es-419]
  - [mispeces.com, ES, es]
  - [aquahoy.com, ES, es]

# Feeds scanned in full; items are kept only if they mention a watched entity.
# Optional: country (default market when the domain doesn't say), pages (WordPress paging).
rss_feeds:
  - name: Undercurrent News
    url: https://www.undercurrentnews.com/feed/
  - name: FeedNavigator
    url: https://www.feednavigator.com/arc/outboundfeeds/rss/
  - name: Global Seafood Alliance
    url: https://www.globalseafood.org/feed/
  - name: iLaks
    url: https://ilaks.no/feed/
    country: "NO"
    pages: 5
  - name: iQua
    url: https://iqua.no/feed/
    country: "NO"
  - name: Aqua.cl
    url: https://www.aqua.cl/feed/
    country: CL
    pages: 2
  - name: Mundo Acuícola
    url: https://www.mundoacuicola.cl/new/feed/
    country: CL
  - name: Panorama Acuícola
    url: https://www.panoramaacuicola.com/feed/
  - name: Fish Farmer
    url: https://www.fishfarmermagazine.com/feed/
    country: GB
  # Denmark: Google News has no Danish edition, so Danish press is read directly.
  - name: Børsen
    url: https://borsen.dk/rss
    country: DK
  - name: DR Penge
    url: https://www.dr.dk/nyheder/service/feeds/penge
    country: DK
  - name: Berlingske
    url: https://www.berlingske.dk/content/rss
    country: DK
  - name: Fiskerforum
    url: https://fiskerforum.dk/feed/
    country: DK
  - name: TV2 Østjylland
    url: https://www.tv2ostjylland.dk/rss
    country: DK
